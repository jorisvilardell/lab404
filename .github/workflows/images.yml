name: Build images

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint ${{ matrix.service }} Dockerfile
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: [web, votes]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: hadolint

      - name: Run Hadolint
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          mkdir -p evidence
          hadolint "apps/${SERVICE}/Dockerfile" | tee "evidence/${SERVICE}.hadolint.txt"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-hadolint-${{ matrix.service }}
          path: evidence/
          if-no-files-found: error

  build:
    name: Build ${{ matrix.service }} for ${{ matrix.target.arch }}
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [web, votes]
        target:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        name: Set image name
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/lab404-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - id: build
        name: Build and push by digest
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: apps/${{ matrix.service }}
          platforms: ${{ matrix.target.platform }}
          # Keep each pushed digest a single-platform manifest so scanners read exactly what the index references.
          provenance: false
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.service }}-${{ matrix.target.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  trivy:
    name: Scan ${{ matrix.service }} ${{ matrix.arch }} with Trivy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        service: [web, votes]
        arch: [amd64, arm64]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: trivy

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digests-${{ matrix.service }}-${{ matrix.arch }}
          path: /tmp/digests

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan the exact platform digest
        env:
          OWNER: ${{ github.repository_owner }}
          SERVICE: ${{ matrix.service }}
          ARCH: ${{ matrix.arch }}
        run: |
          image="ghcr.io/${OWNER,,}/lab404-${SERVICE}@sha256:$(ls /tmp/digests)"
          out="evidence/${SERVICE}-${ARCH}"
          mkdir -p evidence
          echo "$image" > "${out}.image.txt"
          trivy image --quiet --image-src remote --format cyclonedx --output "${out}.cdx.json" "$image"
          trivy image --quiet --image-src remote --scanners vuln --format json --output "${out}.trivy.json" "$image"
          # Gate on fixable CRITICAL/HIGH only; unfixed base-image CVEs stay recorded in the evidence.
          trivy image --quiet --image-src remote --scanners vuln --format table \
            --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 "$image"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: evidence-trivy-${{ matrix.service }}-${{ matrix.arch }}
          path: evidence/
          if-no-files-found: error

  dockle:
    name: Check ${{ matrix.service }} ${{ matrix.arch }} with Dockle
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        service: [web, votes]
        arch: [amd64, arm64]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: dockle

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digests-${{ matrix.service }}-${{ matrix.arch }}
          path: /tmp/digests

      - name: Check the exact platform digest
        env:
          OWNER: ${{ github.repository_owner }}
          SERVICE: ${{ matrix.service }}
          ARCH: ${{ matrix.arch }}
          DOCKLE_USERNAME: ${{ github.actor }}
          DOCKLE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${OWNER,,}/lab404-${SERVICE}@sha256:$(ls /tmp/digests)"
          mkdir -p evidence
          # The gunicorn --access-logfile flag is a CIS-DI-0010 false positive, not a credential.
          dockle --exit-code 1 --exit-level fatal --accept-key --access-logfile \
            --format json --output "evidence/${SERVICE}-${ARCH}.dockle.json" "$image"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: evidence-dockle-${{ matrix.service }}-${{ matrix.arch }}
          path: evidence/
          if-no-files-found: error

  merge:
    name: Publish ${{ matrix.service }} index
    needs: [trivy, dockle]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        service: [web, votes]

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-${{ matrix.service }}-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-platform index
        working-directory: /tmp/digests
        env:
          OWNER: ${{ github.repository_owner }}
          SERVICE: ${{ matrix.service }}
          SHA: ${{ github.sha }}
          MOVE_LATEST: ${{ github.ref == 'refs/heads/main' }}
        run: |
          image="ghcr.io/${OWNER,,}/lab404-${SERVICE}"
          tags=(--tag "${image}:sha-${SHA}")
          if [ "$MOVE_LATEST" = "true" ]; then
            tags+=(--tag "${image}:latest")
          fi
          docker buildx imagetools create "${tags[@]}" $(printf "${image}@sha256:%s " *)
          mkdir -p "$GITHUB_WORKSPACE/evidence"
          docker buildx imagetools inspect "${image}:sha-${SHA}" \
            | tee "$GITHUB_WORKSPACE/evidence/${SERVICE}.index.txt"
          docker buildx imagetools inspect "${image}:sha-${SHA}" --format '{{json .Manifest}}' \
            | jq -r .digest > "$GITHUB_WORKSPACE/evidence/${SERVICE}.index-digest.txt"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-index-${{ matrix.service }}
          path: evidence/
          if-no-files-found: error

  sign:
    name: Sign ${{ matrix.service }} index
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      actions: read
      packages: write
      id-token: write
    strategy:
      matrix:
        service: [web, votes]

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: evidence-index-${{ matrix.service }}
          path: /tmp/index

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          # This job does not check out the repository; keep in sync with cosign in mise.toml.
          mise_toml: |
            [tools]
            cosign = "3.1.4"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign the index and its platform manifests
        env:
          OWNER: ${{ github.repository_owner }}
          SERVICE: ${{ matrix.service }}
        run: |
          repo="ghcr.io/${OWNER,,}/lab404-${SERVICE}"
          cosign sign --yes --recursive "${repo}@$(cat "/tmp/index/${SERVICE}.index-digest.txt")"

      - name: Verify the index and its platform manifests
        env:
          OWNER: ${{ github.repository_owner }}
          SERVICE: ${{ matrix.service }}
          IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          repo="ghcr.io/${OWNER,,}/lab404-${SERVICE}"
          index="$(cat "/tmp/index/${SERVICE}.index-digest.txt")"
          children="$(docker buildx imagetools inspect --raw "${repo}@${index}" | jq -r '.manifests[].digest')"
          mkdir -p evidence
          for digest in "$index" $children; do
            cosign verify \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${repo}@${digest}" > "evidence/${SERVICE}-${digest#sha256:}.cosign.json"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-cosign-${{ matrix.service }}
          path: evidence/
          if-no-files-found: error

  evidence:
    name: Collect security evidence
    needs: sign
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: evidence-*
          path: evidence
          merge-multiple: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-evidence-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
