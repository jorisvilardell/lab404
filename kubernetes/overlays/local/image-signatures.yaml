apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-lab404-image-signatures
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  # Signature verification needs registry access for every matched image, so it
  # runs at admission only instead of on every background scan.
  evaluation:
    background:
      enabled: false
  validationConfigurations:
    # Tags stay as the author wrote them: Kyverno verifies the digest it
    # resolves instead of rewriting the workload.
    mutateDigest: false
    verifyDigest: true
    required: true
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: lab404
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, pods/ephemeralcontainers]
  matchImageReferences:
    - glob: ghcr.io/jorisvilardell/lab404-web:*
    - glob: ghcr.io/jorisvilardell/lab404-web@*
    - glob: ghcr.io/jorisvilardell/lab404-votes:*
    - glob: ghcr.io/jorisvilardell/lab404-votes@*
  attestors:
    - name: github
      cosign:
        keyless:
          identities:
            - subject: https://github.com/jorisvilardell/lab404/.github/workflows/images.yml@refs/heads/main
              issuer: https://token.actions.githubusercontent.com
  validations:
    - expression: >-
        images.containers.map(image, verifyImageSignatures(image, [attestors.github])).all(e, e > 0) &&
        images.?initContainers.orValue([]).map(image, verifyImageSignatures(image, [attestors.github])).all(e, e > 0) &&
        images.?ephemeralContainers.orValue([]).map(image, verifyImageSignatures(image, [attestors.github])).all(e, e > 0)
      message: lab404 application images must be signed by images.yml on refs/heads/main
